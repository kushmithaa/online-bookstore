<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #faf7f2;
            color: #333;
        }

        header {
            background: #5b3a29;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .bar {
            max-width: 1000px;
            margin: 15px auto;
            padding: 0 15px;
        }

        input, select, button {
            padding: 10px;
            margin: 3px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #5b3a29;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #79543d;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 1px 4px #0003;
        }

        .in {
            color: green;
            font-weight: bold;
        }

        .out {
            color: #c0392b;
            font-weight: bold;
        }

        .panel {
            max-width: 1000px;
            margin: 15px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        #thanks {
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }

        #status {
            line-height: 1.8;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #5b3a29;
            color: white;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Bookstore</h1>
    <p>Version 2.0</p>
</header>

<div class="bar">
    <input
        id="q"
        placeholder="Search by title or author"
        oninput="render()"
    >

    <select id="cat" onchange="render()">
        <option>All</option>
        <option>Programming</option>
        <option>Fiction</option>
        <option>Science</option>
        <option>Self-Help</option>
    </select>
</div>

<div class="grid" id="books"></div>

<div class="panel">
    <h2>Shopping Cart</h2>

    <div id="cart">Cart is empty</div>

    <button onclick="placeOrder()">Place Order</button>

    <!-- New Version 2.0 feature -->
    <div id="thanks"></div>
</div>

<div class="panel">
    <h2>Order Status</h2>

    <div id="status">No orders yet</div>
</div>

<footer>
    <p>Online Bookstore | Version 2.0</p>
</footer>

<script>
const books = [
    {
        t: "Clean Code",
        a: "Robert Martin",
        c: "Programming",
        p: 550,
        s: true
    },
    {
        t: "The Pragmatic Programmer",
        a: "Andrew Hunt",
        c: "Programming",
        p: 620,
        s: true
    },
    {
        t: "Wings of Fire",
        a: "A.P.J. Abdul Kalam",
        c: "Self-Help",
        p: 299,
        s: true
    },
    {
        t: "The Alchemist",
        a: "Paulo Coelho",
        c: "Fiction",
        p: 250,
        s: true
    },
    {
        t: "A Brief History of Time",
        a: "Stephen Hawking",
        c: "Science",
        p: 399,
        s: false
    },
    {
        t: "Ponniyin Selvan",
        a: "Kalki",
        c: "Fiction",
        p: 480,
        s: true
    },
    {
        t: "Atomic Habits",
        a: "James Clear",
        c: "Self-Help",
        p: 450,
        s: true
    }
];

let cart = [];
let orders = [];

function render() {
    const q = document.getElementById("q").value.toLowerCase();
    const c = document.getElementById("cat").value;

    document.getElementById("books").innerHTML =
        books.map((b, i) => ({ b, i }))
        .filter(x =>
            (c === "All" || x.b.c === c) &&
            (
                x.b.t.toLowerCase().includes(q) ||
                x.b.a.toLowerCase().includes(q)
            )
        )
        .map(x => `
            <div class="card">
                <h3>${x.b.t}</h3>
                <p>${x.b.a}</p>
                <p>${x.b.c}</p>
                <p><b>Rs. ${x.b.p}</b></p>

                <p class="${x.b.s ? 'in' : 'out'}">
                    ${x.b.s ? 'In Stock' : 'Out of Stock'}
                </p>

                <button
                    ${x.b.s ? '' : 'disabled'}
                    onclick="add(${x.i})"
                >
                    Add to Cart
                </button>
            </div>
        `)
        .join("");
}

function add(i) {
    cart.push(books[i]);
    showCart();

    // Clear the previous thank-you message when shopping again.
    document.getElementById("thanks").innerText = "";
}

function showCart() {
    document.getElementById("cart").innerHTML =
        cart.length
            ? cart.map(b => `${b.t} - Rs. ${b.p}`).join("<br>") +
              "<br><b>Total: Rs. " +
              cart.reduce((sum, b) => sum + b.p, 0) +
              "</b>"
            : "Cart is empty";
}

function placeOrder() {
    if (!cart.length) {
        alert("Please add a book to your cart first!");
        return;
    }

    const id = 1000 + orders.length + 1;

    orders.push({
        id: id,
        st: "Placed"
    });

    cart = [];
    showCart();

    // New Version 2.0 feature
    document.getElementById("thanks").innerText =
        "Thank you for shopping with us!";

    const stages = [
        "Placed",
        "Packed",
        "Shipped",
        "Delivered"
    ];

    let n = 0;

    const timer = setInterval(() => {
        n++;

        orders[orders.length - 1].st = stages[n];

        showStatus();

        if (n === 3) {
            clearInterval(timer);
        }
    }, 3000);

    showStatus();
}

function showStatus() {
    document.getElementById("status").innerHTML =
        orders.map(o =>
            "Order #" + o.id + ": <b>" + o.st + "</b>"
        ).join("<br>");
}

render();
</script>

</body>
</html>
